<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090e17"/>
      <stop offset="100%" stop-color="#04070d"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="url(#brandGrad)" stroke-width="1.5" opacity="0.6"/>

  <!-- Terminal Prompt Symbol >_ -->
  <path d="M16 22 L26 32 L16 42" fill="none" stroke="#10b981" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <line x1="32" y1="42" x2="48" y2="42" stroke="#0ea5e9" stroke-width="3.5" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Inner Code Dot -->
  <circle cx="48" cy="20" r="3" fill="#38bdf8" opacity="0.9"/>
</svg>