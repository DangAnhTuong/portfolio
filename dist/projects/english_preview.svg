<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="engBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="rootGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="glowRoot" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Frame -->
  <rect width="800" height="480" rx="14" fill="url(#engBg)"/>
  
  <!-- Window Top Bar -->
  <rect width="800" height="42" rx="14" fill="#050811"/>
  <rect y="28" width="800" height="14" fill="#050811"/>
  <circle cx="26" cy="21" r="5.5" fill="#ef4444"/>
  <circle cx="44" cy="21" r="5.5" fill="#f59e0b"/>
  <circle cx="62" cy="21" r="5.5" fill="#10b981"/>
  
  <!-- URL -->
  <rect x="200" y="9" width="400" height="24" rx="6" fill="#1e293b"/>
  <text x="400" y="25" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">https://english.danganhtuong.dev/mindmap</text>
  
  <!-- Header Bar -->
  <rect x="20" y="52" width="760" height="46" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1"/>
  <rect x="36" y="62" width="130" height="26" rx="13" fill="#0284c7" opacity="0.2"/>
  <text x="101" y="79" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">⚡ TỪ ĐIỂN TƯ DUY 2.0</text>
  
  <!-- Search Input Simulation -->
  <rect x="180" y="60" width="380" height="30" rx="15" fill="#1f2937" stroke="#374151" stroke-width="1"/>
  <text x="200" y="80" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="600">🔍 run</text>
  <rect x="580" y="60" width="120" height="30" rx="15" fill="#2563eb"/>
  <text x="640" y="80" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Tạo Sơ Đồ AI</text>
  
  <!-- Quick Topics -->
  <g font-family="system-ui, sans-serif" font-size="10" font-weight="600">
    <rect x="36" y="108" width="80" height="22" rx="11" fill="#1e293b"/>
    <text x="76" y="123" fill="#94a3b8" text-anchor="middle">✈️ Du lịch</text>
    <rect x="124" y="108" width="90" height="22" rx="11" fill="#1e293b"/>
    <text x="169" y="123" fill="#94a3b8" text-anchor="middle">💼 Phỏng vấn</text>
    <rect x="222" y="108" width="90" height="22" rx="11" fill="#1e293b"/>
    <text x="267" y="123" fill="#94a3b8" text-anchor="middle">💻 Công nghệ</text>
    <rect x="320" y="108" width="80" height="22" rx="11" fill="#1e293b"/>
    <text x="360" y="123" fill="#94a3b8" text-anchor="middle">🍽️ Ẩm thực</text>
    <rect x="408" y="108" width="80" height="22" rx="11" fill="#1e293b"/>
    <text x="448" y="123" fill="#94a3b8" text-anchor="middle">🏢 Cuộc họp</text>
    <rect x="496" y="108" width="80" height="22" rx="11" fill="#1e293b"/>
    <text x="536" y="123" fill="#94a3b8" text-anchor="middle">🏥 Sức khỏe</text>
  </g>

  <!-- Canvas Board -->
  <rect x="20" y="140" width="760" height="320" rx="10" fill="#0a0f1d" stroke="#1e293b" stroke-width="1"/>
  
  <!-- Mindmap Branches Connectors -->
  <path d="M 400,240 C 260,240 220,185 160,185" stroke="#0284c7" stroke-width="2.5" fill="none" opacity="0.6"/>
  <path d="M 400,240 C 260,240 220,295 160,295" stroke="#2563eb" stroke-width="2.5" fill="none" opacity="0.6"/>
  <path d="M 400,240 C 540,240 580,185 640,185" stroke="#059669" stroke-width="2.5" fill="none" opacity="0.6"/>
  <path d="M 400,240 C 540,240 580,295 640,295" stroke="#dc2626" stroke-width="2.5" fill="none" opacity="0.6"/>
  <path d="M 400,240 C 400,340 400,370 400,390" stroke="#d97706" stroke-width="2.5" fill="none" opacity="0.6"/>

  <!-- CENTRAL ROOT NODE -->
  <g filter="url(#glowRoot)">
    <rect x="320" y="215" width="160" height="50" rx="25" fill="url(#rootGrad)"/>
    <circle cx="345" cy="240" r="14" fill="#ffffff" opacity="0.2"/>
    <text x="345" y="245" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle">⚡</text>
    <text x="400" y="246" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="800">Run</text>
    <text x="450" y="245" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="12">🔊</text>
  </g>
  <!-- IPA Definition Pill below root -->
  <rect x="270" y="272" width="260" height="20" rx="10" fill="#1e293b" stroke="#0284c7" stroke-width="1"/>
  <text x="400" y="286" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">/rʌn/ (v/n) - Chạy, di chuyển, vận hành</text>

  <!-- Branch 1 (Top Left): Nghia & Phien Am -->
  <rect x="40" y="165" width="150" height="42" rx="8" fill="#0f172a" stroke="#0284c7" stroke-width="1.5"/>
  <text x="52" y="183" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="700">📖 Nghĩa &amp; Phiên Âm</text>
  <text x="52" y="198" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9">Di chuyển nhanh / Vận hành</text>

  <!-- Branch 2 (Bottom Left): Ho Tu Vung (Word Family) -->
  <rect x="40" y="275" width="150" height="64" rx="8" fill="#0f172a" stroke="#2563eb" stroke-width="1.5"/>
  <text x="52" y="293" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="11" font-weight="700">🌳 Họ Từ (Word Family)</text>
  <text x="52" y="309" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9.5">• Runner (n): Vận động viên</text>
  <text x="52" y="325" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9.5">• Running (n): Môn chạy bộ</text>

  <!-- Branch 3 (Top Right): Tu Dong Nghia -->
  <rect x="610" y="165" width="150" height="64" rx="8" fill="#0f172a" stroke="#059669" stroke-width="1.5"/>
  <text x="622" y="183" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="700">🌿 Từ Đồng Nghĩa</text>
  <text x="622" y="199" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9.5">• Sprint: Chạy nước rút</text>
  <text x="622" y="215" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9.5">• Operate: Vận hành máy</text>

  <!-- Branch 4 (Bottom Right): Tu Trai Nghia -->
  <rect x="610" y="275" width="150" height="64" rx="8" fill="#0f172a" stroke="#dc2626" stroke-width="1.5"/>
  <text x="622" y="293" fill="#f87171" font-family="system-ui, sans-serif" font-size="11" font-weight="700">🍂 Từ Trái Nghĩa</text>
  <text x="622" y="309" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9.5">• Walk: Đi bộ thong thả</text>
  <text x="622" y="325" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9.5">• Halt: Đình chỉ, dừng lại</text>

  <!-- Branch 5 (Bottom Center): Cum Tu Thong Dung -->
  <rect x="290" y="375" width="220" height="52" rx="8" fill="#0f172a" stroke="#d97706" stroke-width="1.5"/>
  <text x="400" y="394" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">💬 Cụm Từ &amp; Collocations</text>
  <text x="400" y="412" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">• Run out of time • Run a business</text>
</svg>