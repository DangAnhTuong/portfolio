<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="hotelBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1118"/>
      <stop offset="100%" stop-color="#071926"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>

  <rect width="800" height="480" rx="14" fill="url(#hotelBg)"/>
  
  <!-- Window Top Bar -->
  <rect width="800" height="42" rx="14" fill="#050a0f"/>
  <rect y="28" width="800" height="14" fill="#050a0f"/>
  <circle cx="26" cy="21" r="5.5" fill="#ef4444"/>
  <circle cx="44" cy="21" r="5.5" fill="#f59e0b"/>
  <circle cx="62" cy="21" r="5.5" fill="#10b981"/>
  
  <!-- URL -->
  <rect x="220" y="9" width="360" height="24" rx="6" fill="#162534"/>
  <text x="400" y="25" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">https://tuong-hotel.vercel.app</text>

  <!-- 3D Viewport Navbar -->
  <rect x="20" y="52" width="760" height="40" rx="8" fill="#101d2a" stroke="#1e3247" stroke-width="1"/>
  <text x="36" y="77" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="13" font-weight="800">TUONG LUXURY RESORT &amp; SPA</text>
  
  <!-- 60 FPS Badge -->
  <rect x="540" y="60" width="105" height="24" rx="12" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
  <circle cx="552" cy="72" r="3.5" fill="#10b981"/>
  <text x="562" y="76" fill="#6ee7b7" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700">60 FPS Stable</text>

  <!-- Three.js Tag -->
  <rect x="655" y="60" width="110" height="24" rx="12" fill="#0284c7"/>
  <text x="710" y="76" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">Three.js WebGL</text>

  <!-- 3D Canvas Area with Isometric Room Mesh -->
  <rect x="20" y="100" width="760" height="360" rx="10" fill="#07111b" stroke="#16293d" stroke-width="1"/>

  <!-- 3D Room Isometric Perspective Wireframe / Shading -->
  <polygon points="400,120 700,210 400,300 100,210" fill="#102334" stroke="#0ea5e9" stroke-width="1.5" opacity="0.8"/>
  <polygon points="100,210 400,300 400,430 100,340" fill="#0c1b28" stroke="#0ea5e9" stroke-width="1.5" opacity="0.6"/>
  <polygon points="700,210 400,300 400,430 700,340" fill="#13273a" stroke="#0ea5e9" stroke-width="1.5" opacity="0.7"/>

  <!-- 3D Luxury Bed Simulation -->
  <polygon points="400,240 520,280 400,320 280,280" fill="#1e3a5f" stroke="#38bdf8" stroke-width="1.2"/>
  <polygon points="280,280 400,320 400,345 280,305" fill="#162c46"/>
  <polygon points="520,280 400,320 400,345 520,305" fill="#23456e"/>
  
  <!-- Pillows & Gold Linens -->
  <polygon points="360,250 440,250 430,270 350,270" fill="#f59e0b" opacity="0.9"/>
  <circle cx="370" cy="255" r="8" fill="#ffffff" opacity="0.7"/>
  <circle cx="410" cy="255" r="8" fill="#ffffff" opacity="0.7"/>

  <!-- 3D Interactive Orbit Indicator -->
  <circle cx="400" cy="270" r="140" stroke="#38bdf8" stroke-width="1" stroke-dasharray="6,6" fill="none" opacity="0.3"/>
  <circle cx="400" cy="270" r="145" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4,8" fill="none" opacity="0.2"/>

  <!-- Floating 3D Tool HUD -->
  <rect x="40" y="380" width="220" height="60" rx="8" fill="#0c1724" stroke="#1f3750" stroke-width="1" opacity="0.95"/>
  <text x="55" y="405" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Royal Ocean Suite 3D</text>
  <text x="55" y="425" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10.5">Click &amp; drag mouse to orbit 360°</text>

  <rect x="560" y="380" width="200" height="60" rx="8" fill="#0c1724" stroke="#1f3750" stroke-width="1" opacity="0.95"/>
  <text x="575" y="405" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12" font-weight="700">$280 / night</text>
  <rect x="575" y="414" width="100" height="20" rx="10" fill="#f59e0b"/>
  <text x="625" y="428" fill="#000000" font-family="system-ui, sans-serif" font-size="10" font-weight="800" text-anchor="middle">Book Suite</text>
</svg>