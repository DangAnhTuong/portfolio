<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="toeicBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="100%" stop-color="#1c2541"/>
    </linearGradient>
    <linearGradient id="toeicAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Window Frame -->
  <rect width="800" height="480" rx="14" fill="url(#toeicBg)"/>
  
  <!-- Window Top Bar -->
  <rect width="800" height="42" rx="14" fill="#090e17"/>
  <rect y="28" width="800" height="14" fill="#090e17"/>
  <circle cx="26" cy="21" r="5.5" fill="#ef4444"/>
  <circle cx="44" cy="21" r="5.5" fill="#f59e0b"/>
  <circle cx="62" cy="21" r="5.5" fill="#10b981"/>
  
  <!-- URL Bar -->
  <rect x="180" y="9" width="440" height="24" rx="6" fill="#1e293b"/>
  <text x="400" y="25" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">https://toeic.danganhtuong.dev/tests/room/test-1</text>
  
  <!-- Exam Room Header -->
  <rect x="20" y="54" width="760" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="36" y="78" fill="#f8fafc" font-family="system-ui, sans-serif" font-weight="700" font-size="13">ETS 2026 OFFICIAL MOCK TEST 01</text>
  
  <!-- Timer Pill -->
  <rect x="520" y="60" width="110" height="26" rx="13" fill="#0f172a" stroke="#ef4444" stroke-width="1.5"/>
  <circle cx="536" cy="73" r="4" fill="#ef4444"/>
  <text x="548" y="78" fill="#fca5a5" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">⏱ 118:45</text>
  
  <!-- Question Counter Pill -->
  <rect x="642" y="60" width="124" height="26" rx="13" fill="#2563eb"/>
  <text x="704" y="78" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Câu 35 / 200</text>
  
  <!-- Left Column: ETS Passage & Photograph -->
  <rect x="20" y="104" width="370" height="356" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
  
  <!-- Image Simulation Card -->
  <rect x="36" y="120" width="338" height="150" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <!-- Photo Simulation elements -->
  <rect x="46" y="130" width="318" height="130" rx="6" fill="#1e293b"/>
  <path d="M 80,240 L 140,170 L 190,210 L 250,150 L 330,240 Z" fill="#334155" opacity="0.6"/>
  <circle cx="120" cy="165" r="14" fill="#38bdf8" opacity="0.4"/>
  <rect x="140" y="180" width="130" height="40" rx="6" fill="#0ea5e9" opacity="0.2"/>
  <text x="205" y="205" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">📷 ETS Real Photograph #35</text>
  
  <!-- Audio Waveform Player -->
  <rect x="36" y="282" width="338" height="54" rx="8" fill="#0f172a" stroke="#2563eb" stroke-width="1.2"/>
  <circle cx="64" cy="309" r="15" fill="#2563eb"/>
  <polygon points="61,302 71,309 61,316" fill="#ffffff"/>
  
  <!-- Waveform lines -->
  <g fill="#38bdf8" opacity="0.85">
    <rect x="94" y="304" width="3" height="10" rx="1.5"/>
    <rect x="101" y="299" width="3" height="20" rx="1.5"/>
    <rect x="108" y="294" width="3" height="30" rx="1.5"/>
    <rect x="115" y="301" width="3" height="16" rx="1.5"/>
    <rect x="122" y="296" width="3" height="26" rx="1.5"/>
    <rect x="129" y="303" width="3" height="12" rx="1.5"/>
    <rect x="136" y="293" width="3" height="32" rx="1.5"/>
    <rect x="143" y="298" width="3" height="22" rx="1.5"/>
    <rect x="150" y="302" width="3" height="14" rx="1.5"/>
    <rect x="157" y="295" width="3" height="28" rx="1.5"/>
    <rect x="164" y="300" width="3" height="18" rx="1.5"/>
    <rect x="171" y="292" width="3" height="34" rx="1.5"/>
    <rect x="178" y="297" width="3" height="24" rx="1.5"/>
    <rect x="185" y="303" width="3" height="12" rx="1.5"/>
    <rect x="192" y="299" width="3" height="20" rx="1.5"/>
    <rect x="199" y="294" width="3" height="30" rx="1.5"/>
  </g>
  <text x="350" y="313" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="end">00:14 / 00:38</text>
  
  <!-- Speed & Audio Controls -->
  <rect x="36" y="348" width="80" height="24" rx="12" fill="#1e293b"/>
  <text x="76" y="364" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">⚡ 1.0x Speed</text>
  <rect x="124" y="348" width="110" height="24" rx="12" fill="#1e293b"/>
  <text x="179" y="364" fill="#10b981" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">🔊 Audio Native CDN</text>

  <!-- Left Stats Footer -->
  <rect x="36" y="386" width="338" height="58" rx="8" fill="#1e293b" opacity="0.6"/>
  <text x="50" y="408" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="700">🏆 18,200 ETS Questions · 11,785 Dictations</text>
  <text x="50" y="428" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">83 Spaced Repetition Sets · 100% Self-Hosted Media</text>

  <!-- Right Column: Interactive Bubble Sheet -->
  <rect x="410" y="104" width="370" height="356" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
  
  <!-- Question Prompt -->
  <text x="428" y="132" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Question 35: What is the woman planning to do?</text>
  
  <!-- Option A -->
  <rect x="428" y="148" width="334" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <circle cx="450" cy="169" r="10" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>
  <text x="450" y="173" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">A</text>
  <text x="472" y="173" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">Submit the financial audit report</text>
  
  <!-- Option B (Correct Selected) -->
  <rect x="428" y="198" width="334" height="42" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <circle cx="450" cy="219" r="10" fill="#10b981"/>
  <text x="450" y="223" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="800" text-anchor="middle">B</text>
  <text x="472" y="223" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Schedule an executive client conference</text>
  <circle cx="742" cy="219" r="8" fill="#10b981"/>
  <path d="M 739,219 L 741,221 L 746,216" stroke="#ffffff" stroke-width="1.8" fill="none"/>
  
  <!-- Option C -->
  <rect x="428" y="248" width="334" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <circle cx="450" cy="269" r="10" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>
  <text x="450" y="273" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">C</text>
  <text x="472" y="273" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">Reserve the boardroom on the third floor</text>
  
  <!-- Option D -->
  <rect x="428" y="298" width="334" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <circle cx="450" cy="319" r="10" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>
  <text x="450" y="323" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">D</text>
  <text x="472" y="323" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">Cancel the regional supplier contract</text>

  <!-- Explanation Box -->
  <rect x="428" y="350" width="334" height="96" rx="8" fill="#0f172a" stroke="#2563eb" stroke-width="1"/>
  <text x="442" y="370" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="700">💡 Lời giải chi tiết &amp; Dẫn chứng ETS:</text>
  <text x="442" y="390" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Dẫn chứng audio: "I will arrange the executive meeting this Thursday."</text>
  <text x="442" y="408" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="10">➔ Chọn đáp án (B): Đồng nghĩa "schedule" với "arrange meeting".</text>
  <text x="442" y="426" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="10">Phân tích bẫy: Đáp án (A) xuất hiện từ gây nhiễu "report" nhưng sai chủ ngữ.</text>
</svg>